[package]
name = "viewer-app"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.37.0", features = ["glow"] }
viewer-core = { version = "0.1.0", path = "../viewer-core" }
viewer-opensysml = { version = "0.1.0", path = "../viewer-opensysml" }
viewer-tools = { version = "0.1.0", path = "../viewer-tools" }

[[bin]]
name = "sysml-viewer-gui"
path = "src/main.rs"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3"
viewer-cli = { path = "../viewer-cli" }
