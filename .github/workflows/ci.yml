name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    name: Format, build, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The toolchain comes from rust-toolchain.toml.
      - name: Install toolchain
        run: rustup toolchain install
      - name: Format
        run: cargo fmt --all --check
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --locked

  # Contract tests run against the real sysml-grpc service, which the
  # opensysml crate downloads into ~/.opensysml/bin on first use.
  contract:
    name: Contract tests (sysml-grpc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Cache the sysml-grpc binary
        uses: actions/cache@v4
        with:
          path: ~/.opensysml/bin
          key: sysml-grpc-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Test against sysml-grpc
        run: cargo test --workspace --locked -- --ignored
